<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Edit profile — 𝓉𝑒𝒶𝑜𝒻𝓇𝓅𝓂</title>
<script>/* not signed in on this device? go to the login page before anything paints (no flash of an empty app) */(function(){try{if(!localStorage.getItem("teaofrpm-auth")){document.documentElement.style.visibility="hidden";location.replace("index.html");}}catch(e){}})();</script>
<script>(function(){try{var t=localStorage.getItem("teaofrpm_theme");if(t==="dark"||((t==="auto"||!t)&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark");var a=localStorage.getItem("teaofrpm_accent");if(a&&a!=="royal")document.documentElement.setAttribute("data-accent",a);var f=localStorage.getItem("teaofrpm_font");if(f&&f!=="default")document.documentElement.setAttribute("data-font",f);}catch(e){}})();</script>
<link rel="preconnect" href="https://jfybtgoofxfhjgeyumzl.supabase.co" crossorigin />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#8B0000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=2" />
<link rel="icon" href="images/icon.svg?v=2" type="image/svg+xml" /><link rel="alternate icon" href="images/icon-192.png?v=2" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="css/app.css?v=70" />
<link rel="stylesheet" href="css/social-extras.css?v=70" />
<link rel="stylesheet" href="css/plus.css?v=70" />
</head>
<body>

<div class="profile-shell ep-page">
  <div class="profile-topbar">
    <a href="profile.html" class="header-icon-btn" id="epBack" title="Back" aria-label="Back" data-icon="back" data-icon-size="16"></a>
    <h2>Edit profile</h2>
    <button type="button" class="ep-save-top" id="epSaveTop" disabled>Save</button>
  </div>

  <div class="profile-scroll" id="epScroll">
    <div class="ep-photo">
      <label class="ep-pfp" for="epPfpInput"><span class="avatar" id="epAvatar"></span><i data-icon="image" data-icon-size="15"></i></label>
      <input type="file" id="epPfpInput" accept="image/*" hidden />
      <div class="ep-photo-actions">
        <label for="epPfpInput" class="ep-link">Change photo</label>
        <button type="button" class="ep-link danger" id="epRemovePfp" hidden>Remove</button>
      </div>
    </div>

    <div class="ep-card">
      <label class="ep-field"><span>Name</span><input id="epName" type="text" maxlength="24" autocomplete="nickname" /></label>
      <label class="ep-field"><span>Username</span><input id="epUsername" type="text" maxlength="20" autocapitalize="off" spellcheck="false" /><small id="epUserHint"></small></label>
      <label class="ep-field"><span>Bio</span><textarea id="epBio" rows="3" maxlength="160" placeholder="Write something about you"></textarea><small><b id="epBioCount">0</b>/160</small></label>
      <label class="ep-field"><span>Website</span><input id="epWebsite" type="url" maxlength="120" placeholder="example.com" autocapitalize="off" /></label>
    </div>

    <div class="ep-card">
      <label class="tp-tg ep-switch"><span><b>Private account</b><small>Only approved followers see your posts</small></span><input type="checkbox" id="epPrivate" /><i></i></label>
      <label class="tp-tg ep-switch"><span><b>Hide like counts</b><small>Others won't see how many likes you get</small></span><input type="checkbox" id="epHideLikes" /><i></i></label>
    </div>

    <p class="error-text" id="epError"></p>
    <button class="btn" id="epSave" style="width:100%" disabled>Save changes</button>
    <a class="ep-more" href="settings.html">More settings ›</a>
    <div style="height:110px"></div>
  </div>

  <nav id="appNav" data-active="profile" data-scroll-el="epScroll"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=70"></script>
<script src="js/core.js?v=70"></script>
<script src="js/plus.js?v=70"></script>
<script src="js/editor.js?v=70"></script>
<script>
(async () => {
  const ME = await App.boot();
  if (!ME) return;
  const $ = (id) => document.getElementById(id);
  const back = `profile.html?u=${encodeURIComponent(ME.username)}`;
  $("epBack").href = back;

  const fill = () => {
    setAvatarContent($("epAvatar"), ME);
    $("epRemovePfp").hidden = !ME.pfp_url;
    $("epName").value = ME.display_name || "";
    $("epUsername").value = ME.username || "";
    $("epBio").value = ME.bio || "";
    $("epBioCount").textContent = String((ME.bio || "").length);
    $("epWebsite").value = ME.website_url || "";
    $("epPrivate").checked = !!ME.is_private;
    $("epHideLikes").checked = !!ME.hide_like_counts;
  };
  fill();

  const fields = ["epName", "epUsername", "epBio", "epWebsite", "epPrivate", "epHideLikes"];
  const dirty = () => {
    const d = $("epName").value.trim() !== (ME.display_name || "") || $("epUsername").value.trim().toLowerCase() !== ME.username
      || $("epBio").value.trim() !== (ME.bio || "") || $("epWebsite").value.trim() !== (ME.website_url || "")
      || $("epPrivate").checked !== !!ME.is_private || $("epHideLikes").checked !== !!ME.hide_like_counts;
    $("epSave").disabled = $("epSaveTop").disabled = !d;
    return d;
  };
  fields.forEach((id) => { $(id).addEventListener("input", dirty); $(id).addEventListener("change", dirty); });
  $("epBio").addEventListener("input", (e) => { $("epBioCount").textContent = e.target.value.length; });

  let uT;
  $("epUsername").addEventListener("input", () => {
    clearTimeout(uT);
    const u = $("epUsername").value.trim().toLowerCase(), h = $("epUserHint");
    h.textContent = ""; h.className = "";
    if (!u || u === ME.username) return;
    if (!/^[a-z0-9_]{3,20}$/.test(u)) { h.textContent = "3–20 letters, numbers or _"; h.className = "bad"; return; }
    uT = setTimeout(async () => {
      const { data, error } = await sb.rpc("username_available", { p_username: u });
      if ($("epUsername").value.trim().toLowerCase() !== u || error) return;
      h.textContent = data ? "✓ Available" : "✕ Already taken"; h.className = data ? "ok" : "bad";
    }, 350);
  });

  // photo: crop in the editor, upload, save — straight away
  $("epPfpInput").addEventListener("change", async (e) => {
    const file = e.target.files[0]; e.target.value = "";
    if (!file) return;
    let blob;
    try { blob = await editAndCompress(file, { title: "Profile photo", aspects: ["1:1"], circle: true, maxSize: 1080 }, 600); }
    catch (err) { toast(err.message || "Could not use this photo."); return; }
    if (!blob) return;
    const av = $("epAvatar"); av.classList.add("uploading");
    try {
      const url = await uploadPublic("avatars", `${ME.id}/${Date.now()}.jpg`, blob);
      const { error } = await sb.from("profiles").update({ pfp_url: url }).eq("id", ME.id);
      if (error) throw error;
      ME.pfp_url = url; App.saveMe(ME); fill(); toast("Profile photo updated");
    } catch (err) { toast(friendlyError(err, "Could not update photo.")); }
    finally { av.classList.remove("uploading"); }
  });
  $("epRemovePfp").addEventListener("click", async () => {
    if (!confirm("Remove your profile photo?")) return;
    const { error } = await sb.from("profiles").update({ pfp_url: null }).eq("id", ME.id);
    if (error) { toast(friendlyError(error, "Could not remove.")); return; }
    ME.pfp_url = null; App.saveMe(ME); fill(); toast("Photo removed");
  });

  const save = async () => {
    const err = $("epError"); err.textContent = "";
    const name = $("epName").value.trim();
    const username = $("epUsername").value.trim().toLowerCase();
    const bio = $("epBio").value.trim();
    let website = $("epWebsite").value.trim();
    if (!name) { err.textContent = "Name can't be empty."; return; }
    if (!/^[a-z0-9_]{3,20}$/.test(username)) { err.textContent = "Username must be 3–20 characters: letters, numbers, underscore only."; return; }
    if (website) {
      if (!/^https?:\/\//i.test(website)) website = `https://${website}`;
      try { new URL(website); } catch { err.textContent = "That website address doesn't look right."; return; }
    }
    const btns = [$("epSave"), $("epSaveTop")];
    btns.forEach((b) => { b.disabled = true; }); $("epSave").textContent = "Saving…";
    try {
      if (username !== ME.username) {
        const { error } = await sb.rpc("change_own_username", { new_username: username });
        if (error) { err.textContent = /taken/i.test(error.message) ? "That username is already taken." : (error.message || "Could not change username."); return; }
      }
      const patch = { display_name: name, bio: bio || null, website_url: website || null, is_private: $("epPrivate").checked, hide_like_counts: $("epHideLikes").checked };
      const { error } = await sb.from("profiles").update(patch).eq("id", ME.id);
      if (error) { err.textContent = error.message || "Could not save changes."; return; }
      Object.assign(ME, patch, { username }); App.saveMe(ME);
      buzz(12); toast("Profile updated");
      setTimeout(() => location.replace(`profile.html?u=${encodeURIComponent(username)}`), 450);
    } finally {
      $("epSave").textContent = "Save changes"; dirty();
    }
  };
  $("epSave").addEventListener("click", save);
  $("epSaveTop").addEventListener("click", save);
  addEventListener("beforeunload", (e) => { if (dirty() && !$("epSave").textContent.includes("Saving")) { e.preventDefault(); e.returnValue = ""; } });
})();
</script>
</body>
</html>
