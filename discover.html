<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Discover — 𝓉𝑒𝒶𝑜𝒻𝓇𝓅𝓂</title>
<script>(function(){try{var t=localStorage.getItem("teaofrpm_theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");var f=localStorage.getItem("teaofrpm_font");if(f&&f!=="default")document.documentElement.setAttribute("data-font",f);}catch(e){}})();</script>
<link rel="preconnect" href="https://jfybtgoofxfhjgeyumzl.supabase.co" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#8B0000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="images/icon-192.png" />
<link rel="icon" href="images/icon-192.png" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="css/app.css?v=25" />
<link rel="stylesheet" href="css/discover.css?v=25" />
<link rel="stylesheet" href="css/social-extras.css?v=25" />
</head>
<body>

<div class="profile-shell">

  <div class="profile-topbar">
    <a href="home.html" class="header-icon-btn" title="Back" data-icon="back" data-icon-size="16"></a>
    <h2>Discover</h2>
    <button class="header-icon-btn" id="refreshNewsBtn" title="Refresh" data-icon="refresh" data-icon-size="18"></button>
  </div>

  <div class="discover-search-box">
    <span class="discover-search-icon" data-icon="search" data-icon-size="15"></span>
    <input type="text" id="discoverInput" placeholder="Search people…" autocomplete="off" />
    <button class="discover-clear" id="discoverClear" title="Clear" data-icon="close" data-icon-size="14"></button>
  </div>

  <div class="news-tabs" id="newsTabs"></div>

  <div class="profile-scroll" id="discoverScroll">
    <div id="tagPage" hidden></div>
    <div id="exploreWrap">
      <div class="trend-row" id="trendRow"></div>
      <div class="discover-section-label explore-label">Explore</div>
      <div class="ig-grid explore-grid" id="exploreGrid"></div>
      <button type="button" class="explore-more" id="exploreMore" hidden>Show more</button>
    </div>
    <div class="discover-section-label" id="discoverLabel">Top stories</div>
    <div class="news-list" id="newsList"></div>
    <div class="discover-list" id="discoverList" hidden></div>
    <div id="newsSentinel" style="height:1px;"></div>
  </div>

  <nav id="appNav" data-active="discover" data-scroll-el="discoverScroll"></nav>
</div>

<div class="reader-layer" id="readerLayer">
  <div class="reader-bar">
    <button class="header-icon-btn" id="readerClose" title="Close" data-icon="close" data-icon-size="17"></button>
    <div class="reader-title" id="readerTitle"></div>
    <a class="header-icon-btn" id="readerOpen" target="_blank" rel="noopener noreferrer" title="Open in browser" data-icon="link" data-icon-size="17"></a>
  </div>
  <div class="reader-body">
    <div class="reader-card">
      <span class="reader-source" id="readerSource"></span>
      <h2 id="fallbackTitle"></h2>
      <p class="reader-summary" id="readerSummary"></p>
      <p class="reader-note">News sites block their pages from opening inside other apps, so the full story opens in your browser.</p>
      <a class="btn" id="fallbackOpen" target="_blank" rel="noopener noreferrer">Read the full story</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=25"></script>
<script src="js/core.js?v=25"></script>
<script src="js/calls.js?v=25"></script>
<script src="js/discover.js?v=25"></script>
</body>
</html>
