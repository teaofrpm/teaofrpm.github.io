<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Tools & games — 𝓉𝑒𝒶𝑜𝒻𝓇𝓅𝓂</title>
<script>(function(){try{var t=localStorage.getItem("teaofrpm_theme");if(t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark");var a=localStorage.getItem("teaofrpm_accent");if(a&&a!=="royal")document.documentElement.setAttribute("data-accent",a);var f=localStorage.getItem("teaofrpm_font");if(f&&f!=="default")document.documentElement.setAttribute("data-font",f);}catch(e){}})();</script>
<link rel="preconnect" href="https://jfybtgoofxfhjgeyumzl.supabase.co" crossorigin />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#8B0000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
<link rel="icon" href="images/icon.svg" type="image/svg+xml" /><link rel="alternate icon" href="images/icon-192.png" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="css/app.css?v=34" />
<link rel="stylesheet" href="css/discover.css?v=34" />
<link rel="stylesheet" href="css/social-extras.css?v=34" />
<link rel="stylesheet" href="css/plus.css?v=34" />
</head>
<body>

<div class="profile-shell">
  <div class="profile-topbar">
    <a href="home.html" class="header-icon-btn" title="Back" data-icon="back" data-icon-size="16"></a>
    <h2>Tools & games</h2>
    <button class="header-icon-btn" id="plusSettingsBtn" title="Plus settings" data-icon="palette" data-icon-size="18"></button>
  </div>

  <div class="profile-scroll" id="toolsScroll">
    <div class="tp-hero" id="toolsHero"></div>
    <div class="discover-search-box tp-page-search">
      <span class="discover-search-icon" data-icon="search" data-icon-size="15"></span>
      <input type="text" id="toolsSearch" placeholder="Search tools & games…" autocomplete="off" />
    </div>
    <div id="toolsList"></div>
    <div style="height:110px"></div>
  </div>

  <nav id="appNav" data-active="home" data-scroll-el="toolsScroll"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=34"></script>
<script src="js/core.js?v=34"></script>
<script src="js/plus.js?v=34"></script>
<script src="js/plus-tools.js?v=34"></script>
<script src="js/plus-games.js?v=34"></script>
<script>
(async () => {
  const P = window.Plus;
  await App.boot();
  const list = document.getElementById("toolsList"), q = document.getElementById("toolsSearch");
  const hero = () => {
    const st = P.get("st", {})[P.dkey()] || 0, f = P.get("focus_log", {})[P.dkey()] || 0;
    document.getElementById("toolsHero").innerHTML = `<div><small>Screen time</small><b>${P.fmtDur(st)}</b></div><div><small>Focus today</small><b>🍅 ${f}m</b></div><div><small>Streak</small><b>🔥 ${P.streak()}</b></div>`;
  };
  const paint = () => {
    const t = q.value.trim().toLowerCase();
    const secs = {};
    P.toolList.filter((x) => !t || x.name.toLowerCase().includes(t)).forEach((x) => (secs[x.sec] = secs[x.sec] || []).push(x));
    list.innerHTML = Object.entries(secs).map(([s, l]) => `<section class="tp-sec"><h3>${escapeHTML(s)}</h3><div class="tp-grid">${l.map((x) => { let b = ""; try { b = x.badge ? x.badge() : ""; } catch {} return `<button type="button" class="tp-tile" data-k="${x.key}">${b !== "" && b != null ? `<em>${escapeHTML(String(b))}</em>` : ""}<b>${x.emoji}</b>${escapeHTML(x.name)}</button>`; }).join("")}</div></section>`).join("") || `<div class="settings-empty" style="padding:24px">Nothing found</div>`;
  };
  list.addEventListener("click", (e) => { const b = e.target.closest("[data-k]"); if (b) { P.buzz(8); P.openTool(b.dataset.k); } });
  q.addEventListener("input", paint);
  document.getElementById("plusSettingsBtn").addEventListener("click", () => P.openSettings());
  addEventListener("app:me", () => {});
  document.addEventListener("click", () => setTimeout(() => { if (!document.querySelector(".app-sheet-backdrop.show")) { paint(); hero(); } }, 400));
  paint(); hero();
  const h = location.hash.slice(1); if (h && P.toolList.some((x) => x.key === h)) setTimeout(() => P.openTool(h), 300);
})();
</script>
</body>
</html>
