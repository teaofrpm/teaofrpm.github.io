<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>𝓉𝑒𝒶𝑜𝒻𝓇𝓅𝓂</title>
<script>/* the real chat name from the first frame (no "Chat → RPM Public Room" flicker on reload) */(function(){try{var c=new URLSearchParams(location.search).get("c")||"";var h=JSON.parse(localStorage.getItem("teaofrpm_rh_"+c)||"null");var n=(h&&h.title)||(c==="11111111-1111-4111-8111-111111111111"?"RPM Public Room":"");if(n)document.title=n+" — 𝓉𝑒𝒶𝑜𝒻𝓇𝓅𝓂";}catch(e){}})();</script>
<script>/* not signed in on this device? go to the login page before anything paints (no flash of an empty app) */(function(){try{if(!localStorage.getItem("teaofrpm-auth")){document.documentElement.style.visibility="hidden";location.replace("index.html");}}catch(e){}})();</script>
<script>(function(){try{var t=localStorage.getItem("teaofrpm_theme");if(t==="dark"||((t==="auto"||!t)&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark");var a=localStorage.getItem("teaofrpm_accent");if(a&&a!=="royal")document.documentElement.setAttribute("data-accent",a);var f=localStorage.getItem("teaofrpm_font");if(f&&f!=="default")document.documentElement.setAttribute("data-font",f);}catch(e){}})();</script>
<link rel="preconnect" href="https://jfybtgoofxfhjgeyumzl.supabase.co" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#8B0000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=2" />
<link rel="icon" href="images/icon.svg?v=2" type="image/svg+xml" /><link rel="alternate icon" href="images/icon-192.png?v=2" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="css/app.css?v=52" />
<link rel="stylesheet" href="css/messages.css?v=52" />
<link rel="stylesheet" href="css/bot.css?v=52" />
<link rel="stylesheet" href="css/chat-polish.css?v=52" />
<link rel="stylesheet" href="css/plus.css?v=52" />
</head>
<body>

<div class="chat-shell room-shell">
  <main class="chat-main">
    <div class="chat-header room-header">
      <a href="messages.html" class="header-icon-btn" data-icon="back" data-icon-size="16" title="Back" aria-label="Back"></a>
      <a class="room-title" id="roomTitleLink">
        <span class="avatar" id="roomAvatar"></span>
        <span>
          <span class="room-name-line"><b id="roomTitle"></b></span>
          <small id="roomSubtitle"></small>
        </span>
      </a>
      <button class="header-icon-btn room-call-btn" id="callAudioBtn" data-icon="phone" data-icon-size="17" title="Voice call" aria-label="Voice call" style="display:none;"></button>
      <button class="header-icon-btn room-call-btn" id="callVideoBtn" data-icon="video" data-icon-size="18" title="Video call" aria-label="Video call" style="display:none;"></button>
      <button class="header-icon-btn" id="searchToggle" title="Search messages" aria-label="Search messages" data-icon="search" data-icon-size="16"></button>
      <button class="header-icon-btn" id="roomInfoBtn" data-icon="more" data-icon-size="18" title="Details" aria-label="Chat details"></button>

      <div class="search-panel" id="searchPanel">
        <input type="search" id="searchInput" placeholder="Search messages…" autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>

    <div class="messages-wrap">
      <div class="messages" id="messages" aria-live="polite"></div>
      <button type="button" class="jump-to-latest" id="jumpLatest" aria-label="Jump to the latest message"></button>
      <div class="typing-indicator" id="typingIndicator"></div>
    </div>

    <div class="composer">
      <div class="reply-bar" id="replyBar">
        <span>Replying to <b id="replyToName"></b>: <span id="replyToText"></span></span>
        <button id="cancelReply" data-icon="close" data-icon-size="14" aria-label="Cancel reply"></button>
      </div>

      <div class="attach-preview" id="attachPreview">
        <img id="attachImg" alt="" />
        <video id="attachVideo" muted playsinline preload="metadata"></video>
        <span id="attachName" style="font-size:12.5px; color:var(--text-muted); min-width:0; flex:1;"></span>
        <div class="attach-opts">
          <button type="button" class="attach-opt" id="editAttach" title="Edit photo"></button>
          <button type="button" class="attach-opt" id="viewOnceBtn" title="View once — they can open it only one time"></button>
        </div>
        <button id="removeAttach">Remove</button>
      </div>
      <div class="attach-preview" id="audioPreview">
        <audio id="audioPreviewPlayer" controls></audio>
        <button id="removeAudioAttach">Remove</button>
      </div>
      <div class="sticker-panel" id="stickerPanel"></div>

      <div class="composer-row x-pill">
        <button type="button" class="icon-btn x3-plus-btn" aria-label="More options" data-icon="plus" data-icon-size="20"></button>
        <button class="icon-btn" id="stickerToggle" title="Stickers" aria-label="Stickers" data-icon="sticker" data-icon-size="19"></button>
        <label class="icon-btn" id="imageBtn" for="imageInput" title="Send image" aria-label="Send image" data-icon="image" data-icon-size="19"></label>
        <input type="file" id="imageInput" accept="image/*,video/*" style="display:none;" />
        <button class="icon-btn" id="voiceBtn" title="Record voice note" aria-label="Record voice note" data-icon="mic" data-icon-size="19"></button>
        <textarea id="msgInput" rows="1" placeholder="Message…" enterkeyhint="send" aria-label="Message"></textarea>
        <button class="send-btn" id="sendBtn" disabled data-icon="send" data-icon-size="18" aria-label="Send"></button>
      </div>
    </div>
  </main>
</div>

<div class="app-sheet-backdrop" id="roomInfoSheet">
  <div class="app-sheet">
    <div class="app-sheet-handle"></div>
    <div class="app-sheet-title" id="roomInfoTitle">Details</div>
    <div class="room-info-body">
      <div id="groupEditArea" style="display:none;">
        <div class="pfp-wrap" style="margin:0 auto 14px;">
          <div class="pfp" id="groupPfp" style="width:70px;height:70px;font-size:24px;"></div>
          <label class="pfp-edit-btn" id="groupPfpEdit" for="groupPfpInput" style="width:26px;height:26px;">
            <span data-icon="edit" data-icon-size="12"></span>
          </label>
          <input type="file" id="groupPfpInput" accept="image/*" style="display:none;" />
        </div>
        <div class="field">
          <label>Name</label>
          <input type="text" id="groupNameEdit" maxlength="40" />
        </div>
        <button class="btn btn-small" id="saveGroupBtn" style="width:100%;">Save changes</button>
        <div class="rule"></div>
      </div>

      <div class="settings-group-title">Members</div>
      <div class="settings-list" id="roomMembers"></div>

      <div id="addMemberArea" style="display:none; margin-top:14px;">
        <div class="settings-group-title">Add people</div>
        <input type="text" class="settings-search" id="addMemberSearch" placeholder="Search anyone on teaofrpm…" autocomplete="off" />
        <div class="settings-list" id="addMemberList"></div>
      </div>

      <button class="btn-outline btn btn-small" id="leaveGroupBtn" style="width:100%; margin-top:16px; display:none;">Leave group</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=52"></script>
<script src="js/core.js?v=52"></script>
<script src="js/plus.js?v=52"></script>
<script src="js/plus-tools.js?v=52"></script>
<script src="js/plus-games.js?v=52"></script>
<script src="js/editor.js?v=52"></script>
<script src="js/calls.js?v=52"></script>
<script src="js/livebg.js?v=52"></script>
<script src="js/room.js?v=52"></script>
<script src="js/chatplus.js?v=52"></script>
</body>
</html>
