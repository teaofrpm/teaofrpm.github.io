<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

<script>/* not signed in on this device? go to the login page before anything paints (no flash of an empty app) */(function(){try{if(!localStorage.getItem("teaofrpm-auth")){document.documentElement.style.visibility="hidden";location.replace("index.html");}}catch(e){}})();</script>
<script>(function(){try{var t=localStorage.getItem("teaofrpm_theme");if(t==="dark"||((t==="auto"||!t)&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.setAttribute("data-theme","dark");var a=localStorage.getItem("teaofrpm_accent");if(a&&a!=="royal")document.documentElement.setAttribute("data-accent",a);var f=localStorage.getItem("teaofrpm_font");if(f&&f!=="default")document.documentElement.setAttribute("data-font",f);}catch(e){}})();</script>
<link rel="preconnect" href="https://jfybtgoofxfhjgeyumzl.supabase.co" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#8B0000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png?v=2" />
<link rel="icon" href="images/icon.svg?v=2" type="image/svg+xml" /><link rel="alternate icon" href="images/icon-192.png?v=2" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="css/app.css?v=65" />
<link rel="stylesheet" href="css/social-extras.css?v=65" />
<link rel="stylesheet" href="css/plus.css?v=65" />
</head>
<body>

<div class="profile-shell">

  <div class="profile-topbar">
    <a href="home.html" class="header-icon-btn" title="Back" aria-label="Back" data-icon="back" data-icon-size="16"></a>
    <h2 id="profileTopTitle">Profile</h2>
    <a href="settings.html" class="header-icon-btn" id="settingsLink" title="Settings" aria-label="Settings" data-icon="gear" data-icon-size="17" style="display:none;"></a>
  </div>

  <div class="profile-scroll" id="profileScroll">

    <div class="profile-head ig-head">
      <div class="ig-top">
        <div class="pfp-wrap">
          <div class="pfp" id="pfpCircle"></div>
          <label class="pfp-edit-btn" id="pfpEditBtn" for="pfpInput" style="display:none;" data-icon="plus" data-icon-size="13" aria-label="Change photo"></label>
          <input type="file" id="pfpInput" accept="image/*" style="display:none;" />
        </div>
        <div class="profile-stats">
          <button type="button" class="stat-item" id="statPosts"><b id="postsCount">0</b><span>Posts</span></button>
          <button type="button" class="stat-item" id="statFollowers"><b id="followersCount">0</b><span>Followers</span></button>
          <button type="button" class="stat-item" id="statFollowing"><b id="followingCount">0</b><span>Following</span></button>
        </div>
      </div>

      <div class="profile-names">
        <div class="profile-display-name" id="profileDisplayName"></div>
        <div class="profile-username" id="profileUsername"></div>
        <span class="private-badge" id="privateBadge" style="display:none;"><span data-icon="lock" data-icon-size="11"></span> Private account</span>
      </div>

      <div class="profile-bio" id="profileBio"></div>
      <a class="profile-website" id="profileWebsite" target="_blank" rel="noopener noreferrer" style="display:none;"></a>
      <div class="profile-meta" id="profileMeta"></div>
      <audio class="profile-song" id="profileSong" controls preload="none" style="display:none;"></audio>

      <div class="profile-actions" id="profileActions"></div>
    </div>

    <div class="highlight-rail" id="highlightRail"></div>

    <div class="requests-panel" id="requestsPanel" style="display:none;">
      <div class="requests-header">Follow requests</div>
      <div class="requests-list" id="requestsList"></div>
    </div>

    <div class="edit-panel" id="editPanel" style="display:none;">
      <div class="field">
        <label>Display name</label>
        <input id="editDisplayName" type="text" maxlength="24" />
      </div>
      <div class="field">
        <label>Username</label>
        <input id="editUsername" type="text" maxlength="20" autocapitalize="off" />
      </div>
      <div class="field">
        <label>Bio</label>
        <textarea id="editBio" rows="3" maxlength="160" style="resize:none; font-family:var(--sans); font-size:15px; padding:12px 14px; border-radius:8px; border:1px solid var(--border-soft); background:var(--white); color:var(--text-dark); outline:none;"></textarea>
        <div class="field-counter"><span id="bioCount">0</span>/160</div>
      </div>
      <div class="field">
        <label>Website</label>
        <input id="editWebsite" type="url" maxlength="120" placeholder="https://example.com" autocapitalize="off" />
      </div>
      <div class="field">
        <label>Profile photo</label>
        <button class="btn-outline btn btn-small" id="removePfpBtn" type="button" style="width:100%;">Remove current photo</button>
      </div>
      <label class="private-toggle-row">
        <input type="checkbox" id="editPrivate" />
        <span>Private account — only approved followers see your posts</span>
      </label>
      <label class="private-toggle-row">
        <input type="checkbox" id="editHideLikes" />
        <span>Hide like counts — others won't see how many likes your posts and reels get (you still can)</span>
      </label>
      <p class="error-text" id="editError"></p>
      <div style="display:flex; gap:10px;">
        <button class="btn-outline btn" id="cancelEditBtn" style="flex:1;">Cancel</button>
        <button class="btn" id="saveEditBtn" style="flex:1;">Save</button>
      </div>
    </div>

    <div class="new-post-box" id="newPostBox" style="display:none;">
      <textarea id="newPostText" rows="2" maxlength="2000" placeholder="Share something…"></textarea>
      <div class="attach-preview" id="postAttachPreview">
        <img id="postAttachImg" alt="" />
        <button id="removePostAttach">Remove</button>
      </div>
      <div class="new-post-row">
        <label class="icon-btn" id="postImageBtn" for="postImageInput" title="Add photo" aria-label="Add photo"></label>
        <input type="file" id="postImageInput" accept="image/*" style="display:none;" />
        <button class="btn btn-small" id="publishPostBtn" style="margin-left:auto;">Post</button>
      </div>
    </div>

    <div class="locked-posts" id="lockedPosts" style="display:none;"></div>

    <div class="profile-tabs ig-tabs" id="profileTabs">
      <button type="button" class="active" data-tab="posts" aria-label="Posts" data-icon="grid" data-icon-size="20"></button>
      <button type="button" data-tab="reels" aria-label="Reels" data-icon="reel" data-icon-size="20"></button>
      <button type="button" data-tab="tagged" aria-label="Tagged" data-icon="tag" data-icon-size="20"></button>
      <button type="button" data-tab="liked" aria-label="Liked" data-icon="heart" data-icon-size="20" data-own="1" style="display:none;"></button>
      <button type="button" data-tab="saved" aria-label="Saved" data-icon="bookmark" data-icon-size="20" data-own="1" style="display:none;"></button>
    </div>

    <div class="ig-grid" id="postsList"></div>
    <div class="ig-grid reels-grid" id="reelsList" style="display:none;"></div>
    <div class="ig-grid" id="taggedList" style="display:none;"></div>
    <div class="ig-grid" id="likedList" style="display:none;"></div>
    <div class="ig-grid" id="savedList" style="display:none;"></div>

  </div>

  <nav id="appNav" data-active="profile" data-scroll-el="profileScroll"></nav>
</div>

<div class="follow-list-modal" id="followListModal">
  <div class="follow-list-card">
    <div class="follow-list-header">
      <span id="followListTitle">Followers</span>
      <button id="closeFollowList" data-icon="close" data-icon-size="14" aria-label="Close"></button>
    </div>
    <div class="follow-list-body" id="followListBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=65"></script>
<script src="js/core.js?v=65"></script>
<script src="js/plus.js?v=65"></script>
<script src="js/plus-tools.js?v=65"></script>
<script src="js/plus-games.js?v=65"></script>
<script src="js/editor.js?v=65"></script>
<script src="js/calls.js?v=65"></script>
<script src="js/social.js?v=65"></script>
<script src="js/profile.js?v=65"></script>
</body>
</html>
